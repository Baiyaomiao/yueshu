name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node build-apk.js
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yueshu-apk
          path: /tmp/final.apk
