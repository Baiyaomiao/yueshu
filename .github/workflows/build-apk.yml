name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: ./android
        run: |
          cp ../app.html ../www/index.html 2>/dev/null || true
          npm install @capacitor/core @capacitor/android 2>/dev/null || true
          ../node_modules/.bin/cap sync android 2>/dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
      - name: Find APK
        run: find $GITHUB_WORKSPACE -name "*.apk" -o -name "*.aab" 2>/dev/null
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: yueshu-apk
          path: ${{ github.workspace }}/*.apk
          if-no-files-found: info
