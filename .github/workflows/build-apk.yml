name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Android WebView project
        id: create
        uses: twlz0ne/android-webview-apk-action@v1
        with:
          app_name: 阅书
          package_name: ys.reader
          version_code: 1
          version_name: "1.0.0"
          html_file: index.html
          icon: icon-512.png
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yueshu-apk
          path: ${{ steps.create.outputs.apk_path }}
