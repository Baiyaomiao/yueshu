<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>藏书阁</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0ebe3;--card:#faf7f2;--text:#2c2823;--text2:#8a7e6b;--text3:#c4b8a4;--accent:#c0392b;--accent2:#e05545;--border:#e5ddd2;--shadow:rgba(0,0,0,.06);--fs:18px;--lh:1.9}
.theme-dark{--bg:#1a1a1a;--card:#252525;--text:#d4d4d4;--text2:#777;--text3:#555;--accent:#e05a4f;--border:#333;--shadow:rgba(0,0,0,.2)}
.theme-green{--bg:#e5f0db;--card:#f0f8ea;--text:#2a3a2a;--text2:#6a8a6a;--border:#c8e0b8;--accent:#2d8a3e;--shadow:rgba(0,0,0,.04)}
.theme-blue{--bg:#dee8f2;--card:#eaf3fa;--text:#2a3040;--text2:#607890;--border:#c0d8ea;--accent:#2c5282;--shadow:rgba(0,0,0,.04)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC','PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0;overflow:hidden;position:fixed;inset:0;-webkit-tap-highlight-color:transparent;user-select:none}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ===== Header ===== */
.hd{position:fixed;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;z-index:30}
.hd .ht{flex:1;font-size:18px;font-weight:700;letter-spacing:.5px}
.hd .ht .bd{color:var(--accent)}
.hd .hr{display:flex;gap:2px}
.hi{width:36px;height:36px;border:none;background:transparent;font-size:17px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:all .15s}
.hi:active{background:rgba(128,128,128,.1);transform:scale(.9)}

/* ===== Bookshelf ===== */
.sf{display:flex;height:100vh;flex-direction:column;padding-top:52px}
.sh{display:flex;align-items:center;gap:16px;padding:14px 16px 0;font-size:14px;flex-shrink:0}
.sh .st{color:var(--text3);cursor:pointer;padding-bottom:6px;position:relative;transition:color .2s}
.sh .st.ac{color:var(--text);font-weight:600}
.sh .st.ac::after{content:'';position:absolute;bottom:0;left:2px;right:2px;height:2.5px;background:var(--accent);border-radius:2px;animation:slideIn .2s}
@keyframes slideIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sh .st .c{color:var(--text3);font-size:12px;margin-left:1px}
.sh .sp{flex:1}
.sh .ed{font-size:12px;color:var(--accent);cursor:pointer;background:transparent;border:none;padding:6px 12px;border-radius:16px;border:1px solid var(--accent);transition:all .15s}
.sh .ed:active{background:var(--accent);color:#fff}
.sg{flex:1;overflow-y:auto;padding:12px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;align-content:start}
@media(min-width:420px){.sg{grid-template-columns:repeat(4,1fr)}}

/* Book Card */
.bc{cursor:pointer;position:relative}
.bc:active .bco{transform:scale(.95)}
.bco{width:100%;aspect-ratio:3/4;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:12px;text-align:center;position:relative;font-size:12px;overflow:hidden;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 12px var(--shadow)}
.bco .e{font-size:34px;margin-bottom:4px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.bco .bt{font-size:11px;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.bco .bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2)}
.bco .bar .f{height:100%;background:rgba(255,255,255,.7);border-radius:0 2px 2px 0;transition:width .5s}
.bn{font-size:11px;margin-top:4px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp{font-size:10px;color:var(--text3);text-align:center;margin-top:1px}
.ba{width:100%;aspect-ratio:3/4;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;font-size:12px;transition:all .2s;background:var(--card)}
.ba:active{background:var(--bg);border-color:var(--accent);transform:scale(.95)}
.ba .bp{font-size:30px;line-height:1;margin-bottom:4px;color:var(--text2)}
.bc .db{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;font-size:10px;cursor:pointer;z-index:2;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.bc.sd .db{display:flex}
.bc.sd .db:active{background:var(--accent)}

/* ===== Reader ===== */
.rd{position:fixed;inset:0;z-index:20;display:none}
.rd.show{display:flex;flex-direction:column}
.rd-bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;will-change:filter}
.rd.show .rd-bg~*{position:relative;z-index:1}
.rd.has-bg .rp{background:rgba(250,247,242,.82)}
.rd.has-bg .rt,.rd.has-bg .rbo{background:rgba(250,247,242,.92)}
.rt{position:absolute;top:0;left:0;right:0;height:52px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;z-index:10;transition:opacity .4s ease}
.rt.hd{opacity:0;pointer-events:none}.rt.ah{opacity:0;pointer-events:none}
.rt.ah{opacity:0;pointer-events:none}
.rt .rti{flex:1;font-size:15px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px}
.rb{flex:1;display:flex;position:relative;margin-top:52px;margin-bottom:44px;overflow:hidden}
.rp{flex:1;display:flex;flex-direction:column;padding:16px 20px;overflow:hidden;position:relative;z-index:1;background:var(--card)}
.rp .ct{font-size:17px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--text2);flex-shrink:0;letter-spacing:.3px}
.rp .ctxt{flex:1;overflow:hidden;font-size:var(--fs);line-height:var(--lh);text-align:justify;word-break:break-word;position:relative}
.rp .ctxt .pg{position:absolute;top:0;left:0;right:0;will-change:transform}
.rp .ctxt .pg p{text-indent:2em;margin-bottom:.45em;transition:opacity .3s}
.rp .ctxt .pg p:last-child{margin-bottom:0}

/* Tap zones */
.tz{position:absolute;top:0;bottom:0;width:33.33%;z-index:5;cursor:pointer}
.tz-l{left:0}
.tz-r{right:0}
.tz-c{left:33.33%;right:33.33%;z-index:6}
.tz-l:active{background:linear-gradient(to right,rgba(128,128,128,.04),transparent)}
.tz-r:active{background:linear-gradient(to left,rgba(128,128,128,.04),transparent)}

/* Bottom bar */
.rbo{position:absolute;bottom:0;left:0;right:0;height:44px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 6px;z-index:10;gap:2px;transition:opacity .4s ease}
.rbo.hd{opacity:0;pointer-events:none}.rbo.ah{opacity:0;pointer-events:none}
.rbo.ah{opacity:0;pointer-events:none}
.rbo .rn{width:36px;height:36px;border:none;background:transparent;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .15s}
.rbo .rn:active{background:rgba(128,128,128,.08)}
.rbo .ri{text-align:center;font-size:11px;color:var(--text3);min-width:34px;flex-shrink:0}
.rbo .rbp{flex:1;min-width:40px;height:3px;-webkit-appearance:none;appearance:none;background:var(--border);outline:none;border-radius:3px;margin:0 4px}
.rbo .rbp::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.rbo .rtb{width:34px;height:34px;border:none;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:all .15s;flex-shrink:0}
.rbo .rtb:active{background:rgba(128,128,128,.08)}

@media(orientation:landscape){.rp{padding:16px 76px}}

/* ===== Upload overlay ===== */
.ov{position:fixed;inset:0;z-index:40;background:var(--card);display:none;animation:fadeIn .2s}
.ov.s{display:block}
.ob{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.ob input{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border .2s}
.ob input:focus{border-color:var(--accent)}
.oc{overflow-y:auto;height:calc(100% - 53px);padding:16px}
.ua{border:2px dashed var(--border);border-radius:14px;padding:32px;text-align:center;cursor:pointer;margin-bottom:14px;transition:all .2s;background:var(--bg)}
.ua:hover{border-color:var(--accent);background:var(--card)}
.ua .ui{font-size:38px;margin-bottom:8px}
.ua .uh{font-size:14px;color:var(--text2)}
.ua .us{font-size:12px;color:var(--text3);margin-top:4px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500}
.fg input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border .2s}
.fg input:focus{border-color:var(--accent)}
.btn{padding:13px 24px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:all .15s;display:block}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 3px 12px rgba(192,57,43,.25)}

/* ===== Settings ===== */
.so{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);display:none;backdrop-filter:blur(3px)}
.so.s{display:block}
.sp{position:fixed;bottom:0;left:0;right:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;padding:20px 20px 30px;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto}
.sp.s{transform:translateY(0)}
.sp .sp-t{font-size:16px;font-weight:700;margin-bottom:18px;text-align:center;letter-spacing:.3px}
.spr{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.spr label{font-size:13px;color:var(--text2);min-width:48px;font-weight:500}
.spr input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.td{width:34px;height:34px;border-radius:50%;border:2.5px solid transparent;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.td.ac{border-color:var(--accent);transform:scale(1.1)}
.td:active{transform:scale(.9)}
.spr select{padding:5px 10px;font-size:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none}

/* ===== TOC ===== */
.tl{max-height:50vh;overflow-y:auto;padding:4px 0}
.ti{padding:11px 16px;font-size:13px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.rmi{display:flex;align-items:center;padding:14px 20px;font-size:15px;cursor:pointer;transition:background .15s;color:var(--text);border-radius:8px;margin:0 6px}.rmi:active{background:rgba(128,128,128,.06)}.ti:hover{background:rgba(128,128,128,.03)}.bm-i{padding:12px 16px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}.bm-i:active{background:rgba(128,128,128,.04)}.bm-i .bm-t{font-weight:600;font-size:13px}.bm-i .bm-s{font-size:11px;color:var(--text3);margin-top:2px}.bm-i .bm-d{font-size:11px;color:var(--accent);float:right;background:0;border:none;cursor:pointer;padding:2px 6px;border-radius:4px}
.ti:active{background:rgba(128,128,128,.06)}
.ti.ac{border-left-color:var(--accent);background:rgba(192,57,43,.05);color:var(--accent);font-weight:600}

/* ===== Search ===== */
.sr{padding:12px;overflow-y:auto;height:calc(100% - 53px)}
.si{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.si:active{background:rgba(128,128,128,.04)}
.si:last-child{border-bottom:none}
.si .sii{flex:1;min-width:0}
.si .sii .t{font-size:14px;font-weight:600}
.si .sii .s{font-size:12px;color:var(--text2);margin-top:2px}
.si>span{color:var(--text3)}

/* ===== Common ===== */
.ni{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border)}
.ni:last-child{border-bottom:none}
.ni .ni-i{flex:1;min-width:0}
.ni .ni-i .t{font-size:14px;font-weight:600}
.ni .ni-i .s{font-size:12px;color:var(--text2);margin-top:2px}

.empty{text-align:center;padding:70px 20px;color:var(--text3)}
.empty .ei{font-size:52px;margin-bottom:12px;opacity:.6}
.empty p{font-size:14px}

.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(0);background:rgba(40,40,40,.92);color:#fff;padding:11px 22px;border-radius:10px;font-size:13px;z-index:100;animation:ttIn .3s;white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.15)}
@keyframes ttIn{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div class="hd" id="hdr">
  <div class="ht"><span class="bd">藏</span><span>书阁</span></div>
  <div class="hr">
    <button class="hi" id="hSch">🔍</button>
    <button class="hi" id="hUp">📤</button>
    <button class="hi" id="hSet">⚙</button>
  </div>
</div>

<div class="sf" id="shf">
  <div class="sh" id="shHdr">
    <span class="st ac" data-f="recent">最近</span>
    <span class="st" data-f="all">全部 <span class="c" id="allC">0</span></span>
    <span class="sp"></span>
    <button class="ed" id="edBtn" style="display:none">编辑</button>
  </div>
  <div class="sg" id="shG"></div>
</div>

<div class="rd" id="rdr">
  <div class="rd-bg" id="rdBg"></div>
  <div class="rt" id="rTop">
    <button class="hi" id="rBk" style="font-size:20px;width:auto;padding:0 8px">‹</button>
    <div class="rti" id="rTi">阅读</div>
    <button class="hi" id="rMo" style="font-size:24px;font-weight:700;line-height:1">⋮</button>
  </div>
  <div class="rb" id="rBd">
    <div class="tz tz-l" id="tzP"></div>
    <div class="tz tz-c" id="tzC"></div>
    <div class="tz tz-r" id="tzN"></div>
    <div class="rp" id="rPg">
      <div class="ct" id="chTi"></div>
      <div class="ctxt" id="chTx"><div class="pg" id="pgCt"></div></div>
    </div>
  </div>
  <div class="rbo" id="rBo">
    <button class="rn" id="prCh">‹</button>
    <input type="range" class="rbp" id="pgBa" min="0" max="100" value="0">
    <span class="ri" id="pgIn">1/1</span>
    <button class="rtb" id="rFb">Aa</button>
    <button class="rtb" id="rTb">☀</button>
    <button class="rtb" id="rDb">⬇</button>
    <button class="rn" id="nxCh">›</button>
  </div>
</div>

<div class="ov" id="upOv">
  <div class="ob">
    <button class="hi" id="uBk" style="font-size:14px;width:auto">‹ 返回</button>
    <span style="font-weight:600">上传小说</span>
  </div>
  <div class="oc">
    <div class="fg"><label>📖 书名</label><input type="text" id="nvTi" placeholder="输入小说名称"></div>
    <div class="fg"><label>✏️ 作者</label><input type="text" id="nvAu" placeholder="输入作者名"></div>
    <div class="ua" id="upAr">
      <div class="ui">📂</div>
      <div class="uh">点击选择 .txt 文件</div>
      <div class="us">自动识别 UTF-8 / GBK</div>
    </div>
    <input type="file" id="fIn" accept=".txt" style="display:none">
    <div style="font-size:12px;color:var(--text3);margin-bottom:12px" id="fNm">未选择文件</div>
    <button class="btn btn-p" id="upBt">📤 上传</button>
    <div style="margin-top:20px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px">📋 书库 <span style="font-size:12px;color:var(--text3);font-weight:400" id="bCount">0本</span></div>
    <div id="bkL" style="margin-top:4px"></div>
  </div>
</div>

<div class="ov" id="schOv">
  <div class="ob">
    <button class="hi" id="sBk" style="font-size:14px;width:auto">‹ 返回</button>
    <input type="text" id="sIn" placeholder="🔍 搜索书名或作者…">
    <button class="hi" id="sCl">✕</button>
  </div>
  <div class="sr" id="sRs"><div class="empty"><div class="ei">🔍</div><p>输入关键词搜索小说</p></div></div>
</div>

<div class="so" id="stOv"></div>
<div class="sp" id="stPn">
  <div class="sp-t">⚙ 阅读设置</div>
  <div class="spr"><label>🔤 字号</label><input type="range" id="fsS" min="12" max="28" value="18"><span style="font-size:12px;color:var(--text2);min-width:24px;text-align:center" id="fsL">18</span></div>
  <div class="spr"><label>📏 行距</label><select id="lhS"><option value="1.5">紧凑</option><option value="1.9" selected>舒适</option><option value="2.2">宽松</option><option value="2.6">超宽</option></select></div>
  <div class="spr"><label>🎨 主题</label><div class="td ac" data-t="sepia" style="background:#f0ebe3;border-color:var(--accent)"></div><div class="td" data-t="dark" style="background:#1a1a1a"></div><div class="td" data-t="green" style="background:#e5f0db"></div><div class="td" data-t="blue" style="background:#dee8f2"></div></div>
  <div class="spr"><label>🖐 单手</label><span style="font-size:12px;color:var(--text3);flex:1">点击屏幕左右两侧翻下一页</span><button class="hi" id="ohTg" style="font-size:13px;width:auto;padding:4px 14px;border:1px solid var(--border);border-radius:8px;color:var(--text2)">关闭</button></div>
  <div class="spr"><label>📄 双页</label><span style="font-size:12px;color:var(--text3);flex:1">横屏可用</span><button class="hi" id="duTg" style="font-size:13px;width:auto;padding:4px 14px;border:1px solid var(--border);border-radius:8px;color:var(--text2)">关闭</button></div>
  <div style="border-top:1px solid var(--border);margin:14px 0 10px;padding-top:14px"><div style="font-size:14px;font-weight:600;margin-bottom:14px;text-align:center">🖼 自定义背景</div><div class="spr"><button class="hi" id="bgBtn" style="font-size:12px;width:auto;padding:6px 14px;border:1px solid var(--border);border-radius:8px">📁 选择图片</button><button class="hi" id="bgRst" style="font-size:12px;width:auto;padding:6px 14px;border:1px solid var(--border);border-radius:8px;color:var(--accent)">🗑 移除</button></div><div class="spr"><label style="min-width:auto">🌫 模糊</label><input type="range" id="bgBl" min="0" max="20" value="0"><span style="font-size:12px;color:var(--text2);min-width:28px;text-align:center" id="bgBlL">0px</span></div><div id="bgPr" style="width:100%;height:60px;border-radius:8px;border:1px solid var(--border);background-size:cover;background-position:center;margin-top:6px;background:var(--bg)" class="bg-na"><div style="text-align:center;line-height:60px;font-size:12px;color:var(--text3)">未设置背景</div></div><input type="file" id="bgIn" accept="image/*" style="display:none"></div>

  <div class="spr"><label>🔄 翻页</label><select id="pgMd"><option value="tap">点击翻页</option><option value="slide">横滑翻页</option><option value="scroll">上下滑动</option><option value="none">无动效</option></select></div>
  </div>

<div class="so" id="rMenuOv" style="z-index:50"></div>
<div class="sp" id="rMenuPn" style="z-index:51;border-radius:14px;padding:10px 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);max-width:340px;margin:0 auto;width:calc(100% - 40px)">

<script>
const DN='ys_db',DV=1,DS='data';
let DB={novels:[]};
var _rdy,_rdyP=new Promise(function(r){_rdy=r;});
function idbO(){return new Promise(function(r,j){var q=indexedDB.open(DN,DV);q.onupgradeneeded=function(){var d=q.result;if(!d.objectStoreNames.contains(DS))d.createObjectStore(DS);};q.onsuccess=function(){r(q.result);};q.onerror=function(){j(q.error);};});}
async function ldDB(){try{var m=localStorage.getItem('ys_m');if(m){var p=JSON.parse(m);if(p.n)DB.novels=p.n;}var d=await idbO();var t=d.transaction(DS,'readonly');var r=t.objectStore(DS).get('c');var cm=await new Promise(function(r2){r.onsuccess=function(){r2(r.result||{});};r.onerror=function(){r2({});};});d.close();DB.novels.forEach(function(n){if(cm[n.id])n.content=cm[n.id];});}catch(e){try{var r2=localStorage.getItem('ys_a');if(r2){var p2=JSON.parse(r2);if(p2.novels)DB.novels=p2.novels;}}catch(e2){}}if(!DB.novels)DB.novels=[];_rdy();}
async function svMeta(){try{var m={n:DB.novels.map(function(n){return{id:n.id,title:n.title,author:n.author,uploadedAt:n.uploadedAt,progress:n.progress,readAt:n.readAt};})};localStorage.setItem('ys_m',JSON.stringify(m));}catch(e){}}
async function svCont(id,c){try{var d=await idbO();var t=d.transaction(DS,'readwrite');var r=t.objectStore(DS).get('c');var map=await new Promise(function(r2){r.onsuccess=function(){r2(r.result||{});};});map[id]=c;t.objectStore(DS).put(map,'c');await new Promise(function(r2){t.oncomplete=r2;});d.close();}catch(e){try{var all={novels:DB.novels};localStorage.setItem('ys_a',JSON.stringify(all));}catch(e2){tt('存储空间不足');}}}
ldDB();

function $(id){return document.getElementById(id);}
let curN=null,curC=0,curP=0,pgs=[],sF='recent',dOn=false,pgMd='tap',ahTm=null,ahOn=true;
const CV=['#c0392b','#2c6e49','#2c5282','#6b46c1','#b7791f','#2d3748','#553c7b','#9b2c2c'];

/* ===== Enhanced chapter parsing ===== */
function parseChapters(text){
  var lines=text.split('\n').filter(function(l){return l.trim();});
  var rx=/^(第[一二三四五六七八九十百千0-9零一二三四五六七八九十百千万]+[章节部回集篇]|第[0-9]+章|\d+\.\s+|Chapter\s+\d+|序章|前言|序幕|尾声|后记|番外|楔子)/i;
  var cs=[],cu={title:'开头',content:''},cnt=0;
  lines.forEach(function(l){
    var t=l.trim();
    if(rx.test(t)&&cnt>0){
      if(cu.content)cs.push(cu);
      cu={title:t,content:''};
    }else{
      cu.content+=(cu.content?'\n\n':'')+t;
    }
    cnt++;
  });
  if(cu.content)cs.push(cu);
  if(cs.length===0)cs.push({title:'全文',content:text||''});
  return cs;
}
function tt(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);}
function es(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function ag(ts){var m=Math.floor((Date.now()-ts)/60000);if(m<60)return m+'分钟前';return Math.floor(m/60)+'小时前';}
function ui(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

function rSh(){var g=$('shG');g.innerHTML='';var bs=DB.novels.slice();if(sF==='recent'){bs=bs.filter(function(n){return(n.readAt||0)>0;}).sort(function(a,b){return(b.readAt||0)-(a.readAt||0);});}$('allC').textContent=DB.novels.length;if(bs.length===0&&sF==='recent'){g.innerHTML='<div style="grid-column:1/-1"><div class="empty"><div class="ei">📖</div><p>还没有阅读记录</p></div></div>';return;}if(bs.length===0){g.innerHTML='<div style="grid-column:1/-1"><div class="empty"><div class="ei">📚</div><p>点右上角 📤 上传小说</p></div></div>';return;}
  bs.forEach(function(n,i){var c=document.createElement('div');c.className='bc';c.innerHTML='<div class="bco" style="background:'+CV[i%CV.length]+'"><div class="e">📕</div><div class="bt">'+es(n.title)+'</div><div class="bar"><div class="f" style="width:'+(n.progress||0)+'%"></div></div></div><div class="bn">'+es(n.title)+'</div><div class="bp">'+(n.progress||0)+'%</div><button class="db" onclick="event.stopPropagation();dB(\''+n.id+'\')">✕</button>';c.addEventListener('click',function(){if(!c.classList.contains('sd'))oR(n.id);});g.appendChild(c);});
  var a=document.createElement('div');a.className='ba';a.innerHTML='<div class="bp">+</div><div>上传</div>';a.addEventListener('click',function(){oUp();});g.appendChild(a);$('edBtn').style.display=bs.length>0?'':'none';}

function dB(id){var n=DB.novels.find(function(x){return x.id===id;});if(!n||!confirm('删除《'+n.title+'》？'))return;DB.novels=DB.novels.filter(function(x){return x.id!==id;});svMeta();rSh();tt('已删除');}

async function dN(id){var n=DB.novels.find(function(x){return x.id===id;});if(!n||!n.content)return;var text=n.title+'\n作者: '+n.author+'\n\n'+n.content;var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  try{if(window.showSaveFilePicker){var h=await window.showSaveFilePicker({suggestedName:n.title+'.txt',types:[{description:'文本文件',accept:{'text/plain':['.txt']}}]});var w=await h.createWritable();await w.write(blob);await w.close();tt('✅ 已保存');return;}}catch(e){if(e.name!=='AbortError')tt('⚠ 保存失败');}
  try{if(navigator.share&&navigator.canShare){var f=new File([blob],n.title+'.txt',{type:'text/plain;charset=utf-8'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}}catch(e){}
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=n.title+'.txt';document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);tt('✅ 已下载');}

function sRender(chapter){
  var pars=chapter.split('\n\n').filter(Boolean);
  $('pgCt').innerHTML=pars.map(function(p){return '<p>'+es(p.trim())+'</p>';}).join('');
  $('pgCt').style.transform='';
  $('pgCt').style.transition='';
}
function cPg(text){var par=text.split('\n\n').filter(Boolean);$('pgCt').innerHTML=par.map(function(p){return '<p>'+es(p.trim())+'</p>';}).join('');var ch=$('chTx').offsetHeight;if(ch<10)ch=400;var tot=$('pgCt').offsetHeight||1;if(dOn&&window.innerWidth>window.innerHeight)ch=Math.floor(ch*2.05);var n=Math.max(1,Math.ceil(tot/ch));var ps=[];for(var i=0;i<n;i++)ps.push(i);return ps;}
function oR(id){var n=DB.novels.find(function(x){return x.id===id;});if(!n)return;curN=n;curC=0;curP=0;curN._cs=parseChapters(n.content||'');$('rdr').classList.add('show');$('rTi').textContent=n.title;rPg();n.readAt=Date.now();n.progress=Math.round(1/curN._cs.length*100);svMeta();rstAh();}
function rPg(){if(!curN||!curN._cs)return;var cs=curN._cs;if(curC>=cs.length)curC=cs.length-1;if(curC<0)curC=0;var ch=cs[curC];
  if(pgMd==='scroll'){sRender(ch.content);$('chTi').textContent=ch.title;$('pgIn').textContent=(curC+1)+'/'+cs.length;var nn=DB.novels.find(function(x){return x.id===curN.id;});if(nn){nn.progress=Math.round((curC+1)/cs.length*100);nn.readAt=Date.now();svMeta();}return;}
  $('chTi').textContent=ch.title;pgs=cPg(ch.content);if(curP>=pgs.length)curP=pgs.length-1;if(curP<0)curP=0;sPg();var t=cs.length;$('pgBa').value=t>1?Math.round(curC/(t-1)*100):0;$('pgIn').textContent=(curC+1)+'/'+t;var nn=DB.novels.find(function(x){return x.id===curN.id;});if(nn){nn.progress=Math.round((curC+1)/t*100);nn.readAt=Date.now();svMeta();}}
function sPg(){if(!pgs||pgs.length===0||pgMd==='scroll')return;var h=$('chTx').offsetHeight;if(h<10)h=400;$('pgCt').style.transform='translateY(-'+(curP*h)+'px)';$('pgCt').style.transition='transform .25s cubic-bezier(.32,.72,0,1)';}
function nP(){if(pgMd==='scroll'){if(curC<curN._cs.length-1){curC++;rPg();}return;}if(curP<pgs.length-1){curP++;sPg();}else if(curC<curN._cs.length-1){curC++;curP=0;rPg();}}
function pP(){if(pgMd==='scroll'){if(curC>0){curC--;rPg();}return;}if(curP>0){curP--;sPg();}else if(curC>0){curC--;curP=999;rPg();curP=pgs.length-1;sPg();}}

/* Auto-hide bars */
function rstAh(){
  clearTimeout(ahTm);
  $('rTop').classList.remove('ah');$('rBo').classList.remove('ah');ahOn=true;
  if(curN) ahTm=setTimeout(function(){$('rTop').classList.add('ah');$('rBo').classList.add('ah');ahOn=false;},3000);
}
$('tzC').addEventListener('click',function(){
  if(ahOn){$('rTop').classList.add('ah');$('rBo').classList.add('ah');ahOn=false;clearTimeout(ahTm);}
  else{rstAh();}
});
/* Page turn modes */
/* Tap zone - works in click, slide, and none modes */
$('tzP').addEventListener('click',function(){
  if(pgMd==='scroll')return;pP();rstAh();
});
$('tzN').addEventListener('click',function(){
  if(pgMd==='scroll')return;nP();rstAh();
});
/* Swipe support - works in ALL modes but most natural in slide */
(function(){
  var sx=0,swiping=false;
  $('rBd').addEventListener('touchstart',function(e){
    sx=e.touches[0].clientX;swiping=true;
  });
  $('rBd').addEventListener('touchmove',function(e){
    if(!swiping)return;
    var dx=e.touches[0].clientX-sx;
    if(Math.abs(dx)>40){swiping=false;if(dx>0)pP();else nP();rstAh();}
  });
  $('rBd').addEventListener('touchend',function(){swiping=false;});
})();
$('pgBa').addEventListener('input',function(){if(!curN||!curN._cs)return;var t=curN._cs.length,idx=Math.round(parseInt(this.value)/100*(t-1));if(idx!==curC){curC=idx;curP=0;rPg();}});
$('prCh').addEventListener('click',function(){if(curC>0){curC--;curP=0;rPg();}});
$('nxCh').addEventListener('click',function(){if(curN&&curC<curN._cs.length-1){curC++;curP=0;rPg();}});
$('rBk').addEventListener('click',function(){$('rdr').classList.remove('show');curN=null;rSh();;});

function oTc(){
  if(!curN||!curN._cs)return;
  var html='<div style="padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px"><div style="width:40px;height:48px;border-radius:6px;background:'+CV[curN._cs.length%CV.length]+';display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0">📖</div><div><div style="font-weight:700;font-size:15px">'+es(curN.title)+'</div><div style="font-size:12px;color:var(--text3);margin-top:2px">共 '+curN._cs.length+' 章</div></div></div>';
  var list=curN._cs.map(function(c,i){return '<div class="ti'+(i===curC?' ac':'')+'" onclick="jC('+i+')">'+es(c.title||'无标题')+'</div>';}).join('');
  $('tcL').innerHTML=list;  // keep content in scrollable area
  // Update the title area
  var pn=$('tcPn');
  pn.innerHTML='<div class="sp-t" style="display:flex;align-items:center;justify-content:space-between;padding:0 6px">📖 目录 <button id="tcX" style="background:0;border:none;font-size:18px;color:var(--text2);cursor:pointer;padding:4px">✕</button></div>'+html+'<div class="tl" id="tcL">'+list+'</div>';
  // Re-bind close button
  $('tcX').addEventListener('click',cTc);
  $('tcOv').style.display='block';$('tcOv').classList.add('s');pn.classList.add('s');
}
function cTc(){$('tcOv').style.display='none';$('tcOv').classList.remove('s');$('tcPn').classList.remove('s');}
function jC(i){curC=i;curP=0;rPg();cTc();}

$('tcOv').addEventListener('click',cTc);
$('tcX').addEventListener('click',cTc);

function oSt(){$('stOv').style.display='block';$('stOv').classList.add('s');$('stPn').classList.add('s');}
function cSt(){$('stOv').style.display='none';$('stOv').classList.remove('s');$('stPn').classList.remove('s');}
$('hSet').addEventListener('click',oSt);
$('rFb').addEventListener('click',oSt);
$('rTb').addEventListener('click',oSt);
$('stOv').addEventListener('click',cSt);
/* Page mode handler */
/* Page turn mode handler */
$('pgMd').addEventListener('change',function(){
  pgMd=this.value;var ct=$('chTx'),tzP=$('tzP'),tzN=$('tzN');
  if(pgMd==='scroll'){
    ct.style.overflowY='auto';ct.style.overflowX='hidden';
    tzP.style.display='none';tzN.style.display='none';
    $('pgBa').style.display='none';$('pgIn').style.display='none';
  }else{
    ct.style.overflowY='';ct.style.overflowX='';
    tzP.style.display='';tzN.style.display='';
    $('pgBa').style.display='';$('pgIn').style.display='';
  }
  // In all modes except scroll, tap zones work
  // In slide mode, taps go through tzP/tzN click handlers which check pgMd
  // Additional swipe is handled by touch events
  try{localStorage.setItem('ys_pg',pgMd);}catch(e){}
  if(curN)rPg();
});
(function(){try{var p=localStorage.getItem('ys_pg');if(p){$('pgMd').value=p;$('pgMd').dispatchEvent(new Event('change'));}}catch(e){}})();


document.querySelectorAll('.td').forEach(function(d){d.addEventListener('click',function(){document.querySelectorAll('.td').forEach(function(x){x.classList.remove('ac');});d.classList.add('ac');var t=d.dataset.t;document.body.className='theme-'+t;try{localStorage.setItem('ys_th',t);}catch(e){}});});
(function(){try{var st=localStorage.getItem('ys_th');if(st){document.body.className='theme-'+st;document.querySelectorAll('.td').forEach(function(x){x.classList.toggle('ac',x.dataset.t===st);});}}catch(e){}})();
$('fsS').addEventListener('input',function(){var v=this.value;document.documentElement.style.setProperty('--fs',v+'px');$('fsL').textContent=v;try{localStorage.setItem('ys_fs',v);}catch(e){}});
(function(){try{var sf=localStorage.getItem('ys_fs');if(sf){$('fsS').value=sf;$('fsS').dispatchEvent(new Event('input'));}}catch(e){}})();
$('lhS').addEventListener('change',function(){document.documentElement.style.setProperty('--lh',this.value);try{localStorage.setItem('ys_lh',this.value);}catch(e){}});
(function(){try{var sl=localStorage.getItem('ys_lh');if(sl){$('lhS').value=sl;document.documentElement.style.setProperty('--lh',sl);}}catch(e){}})();
$('duTg').addEventListener('click',function(){dOn=!dOn;this.textContent=dOn?'开启':'关闭';this.style.color=dOn?'var(--accent)':'var(--text2)';try{localStorage.setItem('ys_dp',dOn?'1':'0');}catch(e){}if(curN){curP=0;rPg();}});
window.addEventListener('resize',function(){if(curN){curP=0;rPg();}});
(function(){try{if(localStorage.getItem('ys_dp')==='1'){$('duTg').click();}}catch(e){}})();

// ===== Custom Background =====
function apBg(){
  var bg=localStorage.getItem('ys_bg');
  var bl=localStorage.getItem('ys_bg_bl')||'0';
  var el=$('rdBg'),pr=$('bgPr'),sl=$('bgBl'),slL=$('bgBlL');
  if(bg&&bg.length>100){
    el.style.backgroundImage='url('+bg+')';
    el.style.filter='blur('+bl+'px)';
    el.classList.add('has');
    $('rdr').classList.add('has-bg');
    pr.style.backgroundImage='url('+bg+')';
    pr.style.backgroundImage='url('+bg+')';
    pr.classList.remove('bg-na');
    pr.innerHTML='';
    sl.value=bl;
    slL.textContent=bl+'px';
  }else{
    el.style.backgroundImage='';
    el.classList.remove('has');
    $('rdr').classList.remove('has-bg');
    pr.style.backgroundImage='';
    pr.style.background='var(--bg)';
    pr.classList.add('bg-na');
    pr.innerHTML='<div style="text-align:center;line-height:60px;font-size:12px;color:var(--text3)">未设置背景</div>';
    sl.value=0;
    slL.textContent='0px';
  }
}
$('bgIn').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;

    try{localStorage.setItem('ys_bg',ev.target.result);apBg();tt('✅ 背景已设置');}catch(e){tt('❌ 图片太大，无法保存');}
  };
  rd.readAsDataURL(f);
  this.value='';
});
$('bgBtn').addEventListener('click',function(){$('bgIn').click();});
$('bgRst').addEventListener('click',function(){localStorage.removeItem('ys_bg');localStorage.removeItem('ys_bg_bl');apBg();tt('已移除自定义背景');});
$('bgBl').addEventListener('input',function(){
  var v=this.value;
  $('bgBlL').textContent=v+'px';
  try{localStorage.setItem('ys_bg_bl',v);}catch(e){}

apBg();

function oUp(){$('upOv').style.display='block';$('upOv').classList.add('s');rBL();}
$('hUp').addEventListener('click',oUp);
$('uBk').addEventListener('click',function(){$('upOv').style.display='none';$('upOv').classList.remove('s');});
$('upAr').addEventListener('click',function(){$('fIn').click();});
$('fIn').addEventListener('change',function(e){var f=e.target.files[0];$('fNm').textContent=f?f.name:'未选择文件';if(f&&!$('nvTi').value)$('nvTi').value=f.name.replace(/\.txt$/i,'');});
$('upBt').addEventListener('click',async function(){var file=$('fIn').files[0];if(!file){tt('请选择 .txt 文件');return;}var btn=this;btn.disabled=true;btn.innerHTML='⏳ 上传中…';
  try{var text=await new Promise(function(r){var rd=new FileReader();rd.onload=function(ev){var t=ev.target.result,b=0;for(var i=0;i<Math.min(500,t.length);i++){var c=t.charCodeAt(i);if((c>=0x80&&c<=0x9F)||(c>=0xA1&&c<=0xBF))b++;}if(t.length>20&&b/t.length>0.02){var r2=new FileReader();r2.onload=function(e){try{var a=new Uint8Array(e.target.result);t=new TextDecoder('gbk').decode(a);}catch(e2){}r(t);};r2.readAsArrayBuffer(file);}else r(t);};rd.onerror=function(){tt('读取失败');r(null);};rd.readAsText(file,'utf-8');});
  if(!text||text.trim().length<10){tt('文件内容为空');btn.disabled=false;btn.innerHTML='📤 上传';return;}var title=$('nvTi').value.trim()||file.name.replace(/\.txt$/i,'');var author=$('nvAu').value.trim()||'未知';var nid=ui();DB.novels.push({id:nid,title:title,author:author,uploadedAt:Date.now(),progress:0,readAt:0,content:text});await svCont(nid,text);svMeta();tt('✅ 上传成功！');$('fIn').value='';$('fNm').textContent='未选择文件';$('nvTi').value='';$('nvAu').value='';rBL();rSh();}catch(e){tt('❌ '+e.message);}
  btn.disabled=false;btn.innerHTML='📤 上传';});
function rBL(){var el=$('bkL');if(DB.novels.length===0){el.innerHTML='<div class="empty"><p style="font-size:13px">书库为空</p></div>';$('bCount').textContent='0本';return;}$('bCount').textContent=DB.novels.length+'本';
  el.innerHTML=DB.novels.slice().reverse().map(function(n){return '<div class="ni"><div class="ni-i"><div class="t">'+es(n.title)+' <small style="color:var(--text3)">'+es(n.author)+'</small></div><div class="s">'+ag(n.uploadedAt)+' · '+(n.progress||0)+'%</div></div><button class="hi" onclick="dN(\''+n.id+'\')" style="font-size:14px;width:auto;padding:0 8px;flex-shrink:0">⬇</button></div>';}).join('');}

$('hSch').addEventListener('click',function(){$('schOv').style.display='block';$('schOv').classList.add('s');$('sIn').value='';$('sIn').focus();doS();});
$('sBk').addEventListener('click',function(){$('schOv').style.display='none';$('schOv').classList.remove('s');});
$('sCl').addEventListener('click',function(){$('sIn').value='';doS();});
$('sIn').addEventListener('input',doS);
function doS(){var q=$('sIn').value.trim().toLowerCase();var el=$('sRs');if(!q){el.innerHTML='<div class="empty"><div class="ei">🔍</div><p>输入关键词搜索小说</p></div>';return;}var bs=DB.novels.filter(function(n){return n.title.toLowerCase().indexOf(q)!==-1||n.author.toLowerCase().indexOf(q)!==-1;});if(bs.length===0){el.innerHTML='<div class="empty"><div class="ei">📚</div><p>没有找到匹配的小说</p></div>';return;}el.innerHTML=bs.map(function(n){return '<div class="si" onclick="oR(\''+n.id+'\')"><div class="sii"><div class="t">'+es(n.title)+'</div><div class="s">'+es(n.author)+'</div></div><span>→</span></div>';}).join('');}

$('shHdr').addEventListener('click',function(e){var st=e.target.closest('.st');if(!st)return;document.querySelectorAll('.sh .st').forEach(function(x){x.classList.remove('ac');});st.classList.add('ac');sF=st.dataset.f;rSh();});
$('edBtn').addEventListener('click',function(){var cs=document.querySelectorAll('.bc');var on=cs.length>0&&cs[0].classList.contains('sd');cs.forEach(function(c){c.classList.toggle('sd',!on);});this.textContent=on?'编辑':'完成';});
$('rDb').addEventListener('click',function(){if(curN)dN(curN.id);});

(async function(){await _rdyP;rSh();})();
window.dB=dB;window.dN=dN;window.oR=oR;window.jC=jC;

/* Reader floating menu */
function rMenuToggle(){
  var ov=$('rMenuOv'),pn=$('rMenuPn');
  if(ov.style.display==='block'){ov.style.display='none';ov.classList.remove('s');pn.classList.remove('s');}
  else{ov.style.display='block';ov.classList.add('s');pn.classList.add('s');}
}
function rMenuClose(){var ov=$('rMenuOv'),pn=$('rMenuPn');ov.style.display='none';ov.classList.remove('s');pn.classList.remove('s');}
$('rMo').addEventListener('click',function(e){e.stopPropagation();rMenuToggle();rstAh();});
$('rMenuOv').addEventListener('click',rMenuClose);
document.querySelectorAll('.rmi').forEach(function(el){
  el.addEventListener('click',function(){
    var a=this.dataset.a;rMenuClose();
    if(a==='settings')oSt();
    else if(a==='bookmark'){if(!curN)return;var bs=loadBm();var ch=curN._cs&&curN._cs[curC]?curN._cs[curC].title:'未知';var d=new Date();var tm=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');bs.push({nid:curN.id,chapter:ch,chapterIdx:curC,pos:curP,time:tm,ts:Date.now()});saveBm(bs);tt('✅ 已添加书签');}
    else if(a==='search')oFs();
    else if(a==='toc')oTc();
  });
});

/* one-hand */
var ohOn=true;(function(){var el=$('ohTg');if(!el)return;el.addEventListener('click',function(){ohOn=!ohOn;this.textContent=ohOn?'开启':'关闭';this.style.color=ohOn?'var(--accent)':'var(--text2)';var a=$('tzP'),b=$('tzN');if(ohOn){a.style.display='';b.style.display='';}else{a.style.display='none';b.style.display='none';}try{localStorage.setItem('ys_oh',ohOn?'1':'0');}catch(e){}});
try{if(localStorage.getItem('ys_oh')==='0')el.click();}catch(e){}})();

/* bookmarks */
function loadBm(){try{return JSON.parse(localStorage.getItem('ys_bm')||'[]');}catch(e){return [];}}
function saveBm(b){try{localStorage.setItem('ys_bm',JSON.stringify(b));}catch(e){}}
function renderBm(){var bs=loadBm().filter(function(b){return b.nid===curN.id;});var el=$('bmL');if(bs.length===0){el.innerHTML='<div class=\"empty\"><div class=\"ei\">🔖</div><p>暂无书签</p></div>';return;}
el.innerHTML=bs.map(function(b,i){return '<div class=\"bm-i\" onclick=\"jBm('+i+')\"><span class=\"bm-t\">'+es(b.chapter||'')+'</span><button class=\"bm-d\" onclick=\"event.stopPropagation();dBm('+i+')\">✕</button><div class=\"bm-s\">位置 '+(b.pos+1)+' &middot; '+b.time+'</div></div>';}).join('');}
function jBm(i){var bs=loadBm().filter(function(b){return b.nid===curN.id;});if(!bs[i])return;var b=bs[i];curC=Math.min(b.chapterIdx,curN._cs.length-1);curP=Math.min(b.pos,9999);rPg();cBm();}
function dBm(i){var bs=loadBm();var items=bs.filter(function(b){return b.nid===curN.id;});if(!items[i])return;var idx=bs.indexOf(items[i]);if(idx>-1){bs.splice(idx,1);saveBm(bs);renderBm();tt('已删除书签');}}
function oBm(){renderBm();$('bmOv').style.display='block';$('bmOv').classList.add('s');$('bmPn').classList.add('s');}
function cBm(){$('bmOv').style.display='none';$('bmOv').classList.remove('s');$('bmPn').classList.remove('s');}
$('bmAdd').addEventListener('click',function(){if(!curN)return;var bs=loadBm();var ch=curN._cs&&curN._cs[curC]?curN._cs[curC].title:'未知';var d=new Date();var t=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');bs.push({nid:curN.id,chapter:ch,chapterIdx:curC,pos:curP,time:t,ts:Date.now()});saveBm(bs);renderBm();tt('✅ 已添加书签');});
$('bmOv').addEventListener('click',cBm);$('bmX').addEventListener('click',cBm);

/* full-text search */
function oFs(){$('fsOv').style.display='block';$('fsOv').classList.add('s');$('fsPn').classList.add('s');$('fsIn').value='';$('fsIn').focus();$('fsL').innerHTML='<div class=\"empty\"><div class=\"ei\">🔍</div><p>输入关键词搜索</p></div>';}
function cFs(){$('fsOv').style.display='none';$('fsOv').classList.remove('s');$('fsPn').classList.remove('s');}
$('fsOv').addEventListener('click',cFs);$('fsX').addEventListener('click',cFs);
$('fsIn').addEventListener('keydown',function(e){if(e.key==='Enter')doFs();});
$('fsGo').addEventListener('click',doFs);
function doFs(){var q=$('fsIn').value.trim().toLowerCase();var el=$('fsL');if(!q||!curN||!curN.content){el.innerHTML='<div class=\"empty\"><div class=\"ei\">🔍</div><p>输入关键词搜索</p></div>';return;}
var lines=curN.content.split('\\n');var rs=[];lines.forEach(function(l,i){if(l.toLowerCase().indexOf(q)!==-1)rs.push({line:i,text:l.substring(0,80)});});
if(rs.length===0){el.innerHTML='<div class=\"empty\"><div class=\"ei\">📖</div><p>未找到 "<b>'+es(q)+'</b>"</p></div>';return;}
el.innerHTML=rs.slice(0,100).map(function(r){return '<div class=\"ti\" onclick=\"jFs('+r.line+')\">'+es(r.text)+'</div>';}).join('')+(rs.length>100?'<div style="padding:12px;text-align:center;font-size:12px;color:var(--text3)">...还有 '+(rs.length-100)+' 条结果</div>':'');
}
function jFs(i){if(!curN||!curN._cs)return;var n=0;for(var c=0;c<curN._cs.length;c++){var ch=curN._cs[c];var ls=(ch.content||'').split('\\n').filter(Boolean);if(n+ls.length>i){curC=c;curP=0;rPg();cFs();return;}n+=ls.length;}}


</script>
