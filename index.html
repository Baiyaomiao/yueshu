<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>阅书 - 私人阅读器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f0e8;--card:#faf6ef;--text:#3a342b;--text2:#8a7e6b;--text3:#b8aa96;--accent:#c0392b;--accent2:#a93226;--border:#e8e0d2;--success:#2d8a3e;--fs:18px;--lh:1.9}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:100%;margin:0;overflow-x:hidden;--h:52px;--b:56px}
input,button,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Header */
.header{position:fixed;top:0;left:0;right:0;height:var(--h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;z-index:30}
.header .ht{flex:1;font-size:17px;font-weight:700}
.header .ht .brand{color:var(--accent)}
.header .hr{display:flex;gap:2px}
.header .hi{width:36px;height:36px;border:none;background:0;font-size:18px;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}

/* Pages */
.page{display:none;padding-top:var(--h);min-height:100vh}
.page.active{display:block}
.page.pad{padding-bottom:var(--b)}

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--b);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:0;border:none;color:var(--text3);font-size:10px;cursor:pointer}
.tab-btn .ti{font-size:20px;line-height:1}
.tab-btn.active{color:var(--accent)}
@media(orientation:landscape){.tab-bar{left:0;top:var(--h);bottom:0;width:60px;height:auto;flex-direction:column;border-top:none;border-right:1px solid var(--border)}.tab-btn{gap:4px;padding:8px 0}.page.pad{padding-bottom:0;padding-left:60px}}

/* Bookshelf */
.sh{display:flex;align-items:center;gap:16px;padding:12px 16px 0;font-size:14px}
.sh .st{color:var(--text3);cursor:pointer;padding-bottom:4px}
.sh .st.active{color:var(--text);font-weight:600;border-bottom:2px solid var(--accent)}
.sh .st .cnt{color:var(--text3);font-size:12px;margin-left:2px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px}
@media(min-width:420px){.sg{grid-template-columns:repeat(4,1fr)}}
.bc{cursor:pointer;position:relative}
.bc:active .bco{transform:scale(.95)}
.bco{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:10px;text-align:center;position:relative;font-size:12px;overflow:hidden;transition:transform .15s}
.bco .em{font-size:32px;margin-bottom:4px}
.bco .bt{font-size:11px;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bco .bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2)}
.bco .bar .f{height:100%;background:rgba(255,255,255,.7);border-radius:0 2px 2px 0}
.bn{font-size:11px;margin-top:3px;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bp{font-size:10px;color:var(--text3);text-align:center;margin-top:1px}
/* Add button */
.ba{width:100%;aspect-ratio:3/4;border-radius:8px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text3);cursor:pointer;font-size:12px}
.ba .bp{font-size:32px;line-height:1}
/* Delete overlay */
.bc .delb{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:10px;cursor:pointer;z-index:2;display:none;align-items:center;justify-content:center}
.bc.show-del .delb{display:flex}
.del-btn{position:absolute;top:8px;right:12px;font-size:12px;color:var(--accent);cursor:pointer;background:0;border:none;z-index:3}

/* Reader */
.reader-page{padding-top:0;background:var(--card)}
.rtop{position:fixed;top:0;left:0;right:0;height:var(--h);background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;z-index:30;transition:transform .3s}
.rtop.hide{transform:translateY(-100%)}
.rtop .rt{flex:1;font-size:15px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0 8px}
.rbody{padding:52px 16px 100px;min-height:100vh}
.rbody .rtitle{font-size:18px;font-weight:700;text-align:center;margin-bottom:16px;color:var(--text2)}
.rcontent{font-size:var(--fs);line-height:var(--lh);text-align:justify;word-break:break-word}
.rcontent p{text-indent:2em;margin-bottom:.4em}
@media(orientation:portrait){.rcontent.col2{column-count:2;column-gap:16px;column-rule:1px solid var(--border)}.rcontent.col2 p{text-indent:1.5em;margin-bottom:.3em;break-inside:avoid}}
.rbot{position:fixed;bottom:0;left:0;right:0;z-index:30;transition:transform .3s}
.rbot.hide{transform:translateY(100%)}
.rbp{background:var(--card);padding:8px 16px 4px}
.rbp input{width:100%;height:3px;-webkit-appearance:none;appearance:none;background:var(--border);outline:none;border-radius:2px}
.rbp input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--card);box-shadow:0 0 4px rgba(0,0,0,.2)}
.rbn{background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;padding:6px 12px;gap:8px}
.rbn .rnb{width:40px;height:40px;border:none;background:0;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}
.rbn .rnb:active{background:rgba(128,128,128,.08)}
.rbn .rni{flex:1;text-align:center;font-size:12px;color:var(--text3)}
.rbt{background:var(--card);border-top:1px solid var(--border);display:flex;padding:6px 12px;gap:4px}
.rbt .rtb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border:none;background:0;color:var(--text2);font-size:10px;cursor:pointer;border-radius:8px}
.rbt .rtb:active{background:rgba(128,128,128,.06)}
.rbt .rtb .rtic{font-size:18px}
.listen-btn{position:fixed;bottom:142px;right:16px;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 12px rgba(192,57,43,.3);z-index:25;display:flex;align-items:center;justify-content:center}
.listen-btn:active{transform:scale(.9)}
@media(orientation:landscape){.rbody{padding:52px 76px 100px}.rbp{padding:8px 76px 4px}.listen-btn{bottom:142px;right:76px}}

/* Settings Panel */
.soverlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.3);display:none}
.soverlay.s{display:block}
spanel{position:fixed;bottom:0;left:0;right:0;z-index:41;background:var(--card);border-radius:16px 16px 0 0;padding:20px;transform:translateY(100%);transition:transform .25s;max-width:520px;margin:0 auto;display:block}
spanel.s{transform:translateY(0)}
spanel .spt{font-size:16px;font-weight:700;margin-bottom:16px;text-align:center}
.spr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.spr label{font-size:13px;color:var(--text2);min-width:48px}
.spr input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.theme-d{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.theme-d.active{border-color:var(--accent)}
.spr select{padding:4px 8px;font-size:12px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)}

/* TOC Panel */
.toc-list{max-height:50vh;overflow-y:auto;padding:8px 0}
.toc-item{padding:12px 16px;font-size:14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:8px}
.toc-item:hover{background:rgba(128,128,128,.04)}
.toc-item.active{border-left-color:var(--accent);background:rgba(192,57,43,.04);color:var(--accent);font-weight:600}
.toc-item .tc-num{font-size:11px;color:var(--text3);min-width:28px}

/* Upload */
.upload-page{padding:16px;padding-top:calc(var(--h) + 16px)}
.uc{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.uc .uct{font-size:15px;font-weight:700;margin-bottom:12px}
.ua{border:2px dashed var(--border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;margin-bottom:12px}
.ua:hover{border-color:var(--accent)}
.ua .uai{font-size:36px;margin-bottom:8px}
.ua .uah{font-size:14px;color:var(--text2)}
.ua .uas{font-size:12px;color:var(--text3);margin-top:4px}
.uf input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);outline:none;margin-bottom:10px}
.uf input:focus{border-color:var(--accent)}

/* Admin */
.admin-page{padding:16px;padding-top:calc(var(--h) + 16px)}
.ac{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid var(--border)}
.ac .act{font-size:15px;font-weight:700;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.stats .snum{font-size:24px;font-weight:800}
.stats .slbl{font-size:11px;color:var(--text2)}

/* Common */
.btn{padding:12px 24px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:all .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px;width:auto;border-radius:6px}
.btn-success{background:var(--success);color:#fff}
.ni{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border)}
.ni:last-child{border-bottom:none}
.ni .nii{flex:1;min-width:0}
.ni .nii .t{font-size:14px;font-weight:600}
.ni .nii .s{font-size:12px;color:var(--text2);margin-top:2px}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.badge-p{background:#fff3cd;color:#856404}
.badge-a{background:#d4edda;color:#155724}
.badge-r{background:#f8d7da;color:#721c24}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty .eic{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:100;animation:tin .3s;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>

<!-- Header -->
<div class="header" id="mainHeader">
  <div class="ht"><span class="brand">阅</span><span id="pgTitle">书</span></div>
  <div class="hr">
    <button class="hi" id="hSearch" title="搜索">🔍</button>
  </div>
</div>

<!-- Bookshelf -->
<div class="page active pad" id="p-shelf">
  <div class="sh" id="shelfHeader">
    <span class="st active" data-filter="recent">最近阅读</span>
    <span class="st" data-filter="all">全部 <span class="cnt" id="allCount">0</span></span>
    <span style="flex:1"></span>
    <button class="hi" id="shelfDelBtn" style="font-size:13px;width:auto;padding:0 8px;display:none">编辑</button>
  </div>
  <div class="sg" id="shelfGrid"></div>
</div>

<!-- Search Overlay -->
<div class="soverlay" id="searchOverlay" style="background:var(--card);display:none">
  <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)">
    <button class="hi" id="searchBack" style="font-size:14px;width:auto">‹ 返回</button>
    <input type="text" id="searchInput" placeholder="🔍 搜索书名或作者…" style="flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);outline:none">
    <button class="hi" id="searchClear" style="font-size:14px;width:auto">✕</button>
  </div>
  <div id="searchResults" style="padding:12px">
    <div class="empty"><div class="eic">🔍</div><p>输入关键词搜索小说</p></div>
  </div>
</div>

<!-- Upload -->
<div class="page" id="p-upload">
  <div class="upload-page">
    <div class="uc">
      <div class="uct">📤 上传小说</div>
      <div class="uf">
        <input type="text" id="novTitle" placeholder="书名">
        <input type="text" id="novAuthor" placeholder="作者">
      </div>
      <div class="ua" id="uploadArea">
        <div class="uai">📂</div>
        <div class="uah">点击选择 .txt 文件</div>
        <div class="uas">自动识别 UTF-8 / GBK</div>
      </div>
      <input type="file" id="fileInput" accept=".txt" style="display:none">
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px" id="fileName">未选择文件</div>
      <button class="btn btn-primary" id="uploadBtn">提交审核</button>
    </div>
    <div class="uc">
      <div class="uct">📋 我的上传</div>
      <div id="myUploads"></div>
    </div>
  </div>
</div>

<!-- Admin -->
<div class="page" id="p-admin">
  <div class="admin-page">
    <div class="ac">
      <div class="act">📊 概览</div>
      <div class="stats">
        <div><div class="snum" id="stUsers">0</div><div class="slbl">用户</div></div>
        <div><div class="snum" id="stTotal">0</div><div class="slbl">小说</div></div>
        <div><div class="snum" style="color:var(--warn)" id="stPending">0</div><div class="slbl">待审核</div></div>
      </div>
    </div>
    <div class="ac"><div class="act">📝 审核</div><div id="reviewList"></div></div>
    <div class="ac"><div class="act">📕 所有小说</div><div id="allNovelsList"></div></div>
  </div>
</div>

<!-- Reader -->
<div class="page reader-page" id="p-reader">
  <div class="rtop" id="readerTop">
    <button class="hi" id="readerBack" style="font-size:20px;width:auto;padding:0 8px">‹</button>
    <div class="rt" id="readerTitle">阅读</div>
    <div class="hr">
      <button class="hi" id="readerTocBtn" title="目录">📖</button>
      <button class="hi" id="readerSettings" title="设置">A</button>
    </div>
  </div>
  <div class="rbody" id="readerBody">
    <div class="rtitle" id="rdTitle"></div>
    <div class="rcontent" id="rdContent"></div>
  </div>
  <div class="rbot" id="readerBottom">
    <div class="rbp">
      <input type="range" id="rdProgress" min="0" max="100" value="0">
    </div>
    <div class="rbn">
      <button class="rnb" id="prevCh">‹</button>
      <span class="rni" id="rdInfo">1 / 1</span>
      <button class="rnb" id="nextCh">›</button>
    </div>
    <div class="rbt">
      <button class="rtb" id="rtToc"><span class="rtic">📖</span><span>目录</span></button>
      <button class="rtb" id="rtFont"><span class="rtic">Aa</span><span>字体</span></button>
      <button class="rtb" id="rtTheme"><span class="rtic">☀</span><span>主题</span></button>
      <button class="rtb" id="rtDl"><span class="rtic">⬇</span><span>下载</span></button>
    </div>
  </div>
  <button class="listen-btn" id="listenBtn">听</button>
</div>

<!-- Settings Panel -->
<div class="soverlay" id="settingsOverlay"></div>
<spanel id="settingsPanel">
  <div class="spt">阅读设置</div>
  <div class="spr">
    <label>字号</label>
    <input type="range" id="fontSlider" min="12" max="28" value="18">
    <span style="font-size:12px;color:var(--text2);min-width:24px" id="fontLabel">18</span>
  </div>
  <div class="spr">
    <label>行距</label>
    <select id="lineSpace">
      <option value="1.5">紧凑</option>
      <option value="1.9" selected>舒适</option>
      <option value="2.2">宽松</option>
      <option value="2.6">超宽</option>
    </select>
  </div>
  <div class="spr">
    <label>主题</label>
    <div class="theme-d active" data-t="sepia" style="background:#f5f0e8;border-color:var(--accent)"></div>
    <div class="theme-d" data-t="dark" style="background:#1a1a1a"></div>
    <div class="theme-d" data-t="green" style="background:#e8f0e0"></div>
    <div class="theme-d" data-t="blue" style="background:#e0eaf5"></div>
  </div>
</spanel>

<!-- TOC Panel -->
<div class="soverlay" id="tocOverlay"></div>
<spanel id="tocPanel">
  <div class="spt" style="display:flex;align-items:center;justify-content:space-between">
    📖 目录
    <button id="tocClose" style="background:0;border:none;font-size:18px;color:var(--text2);cursor:pointer">✕</button>
  </div>
  <div class="toc-list" id="tocList"></div>
</spanel>

<!-- Tab Bar -->
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-p="p-shelf"><span class="ti">📚</span><span>书架</span></button>
  <button class="tab-btn" data-p="p-upload"><span class="ti">📤</span><span>上传</span></button>
  <button class="tab-btn" data-p="p-admin" id="adminTab"><span class="ti">⚙</span><span>管理</span></button>
</div>

<script>
// ============================================================
// Storage
// ============================================================
const SK = 'yueshu_data';
let DB = { novels: [] };
let curUser = { id: 'local', user: 'local', role: 'admin', nick: '本地用户' };

function loadData() {
  try { var r = localStorage.getItem(SK); if (r) DB = JSON.parse(r); } catch(e) {}
  if (!DB.novels) DB.novels = [];
}
function saveData() { try { localStorage.setItem(SK, JSON.stringify(DB)); } catch(e) { toast('存储空间不足'); } }
loadData();

// ============================================================
// Helpers
// ============================================================
const $ = id => document.getElementById(id);
let rdNovel = null, rdCh = 0, shelfFilter = 'recent';
const CV = ['#c0392b','#2c6e49','#2c5282','#6b46c1','#b7791f','#2d3748','#553c7b','#9b2c2c'];
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function() { t.remove(); }, 2500); }
function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function ago(ts) { var m = Math.floor((Date.now() - ts) / 60000); if (m < 60) return m + '分钟前'; return Math.floor(m / 60) + '小时前'; }
function badge(s) { return '<span class="badge ' + (s === 'approved' ? 'badge-a' : s === 'rejected' ? 'badge-r' : 'badge-p') + '">' + (s === 'approved' ? '已上架' : s === 'rejected' ? '未通过' : '待审核') + '</span>'; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ============================================================
// Page Nav
// ============================================================
function showPage(p) {
  document.querySelectorAll('.page').forEach(function(x) { x.classList.remove('active'); });
  $(p).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(function(x) { x.classList.remove('active'); });
  var tb = document.querySelector('.tab-btn[data-p="' + p + '"]');
  if (tb) tb.classList.add('active');
  var names = { 'p-shelf': '书', 'p-upload': '上传', 'p-admin': '管理' };
  $('pgTitle').textContent = names[p] || '书';
  $('hSearch').style.display = p === 'p-shelf' ? '' : 'none';
  $('tabBar').style.display = p === 'p-reader' ? 'none' : '';
  $('mainHeader').style.display = p === 'p-reader' ? 'none' : '';
  if (p === 'p-shelf') renderShelf();
  if (p === 'p-upload') renderUploads();
  if (p === 'p-admin') renderAdmin();
}

// ============================================================
// Bookshelf
// ============================================================
$('shelfHeader').addEventListener('click', function(e) {
  var st = e.target.closest('.st');
  if (!st) return;
  document.querySelectorAll('.sh .st').forEach(function(x) { x.classList.remove('active'); });
  st.classList.add('active');
  shelfFilter = st.dataset.filter;
  renderShelf();
});

$('shelfDelBtn').addEventListener('click', function() {
  var cards = document.querySelectorAll('.bc');
  var on = cards.length > 0 && cards[0].classList.contains('show-del');
  cards.forEach(function(c) { c.classList.toggle('show-del', !on); });
  $('shelfDelBtn').textContent = on ? '编辑' : '完成';
});

$('hSearch').addEventListener('click', function() {
  $('searchOverlay').style.display = 'block';
  $('searchOverlay').classList.add('s');
  $('searchInput').value = '';
  $('searchInput').focus();
  doSearch();
});
$('searchBack').addEventListener('click', function() { $('searchOverlay').style.display = 'none'; $('searchOverlay').classList.remove('s'); });
$('searchClear').addEventListener('click', function() { $('searchInput').value = ''; doSearch(); });
$('searchInput').addEventListener('input', doSearch);

function doSearch() {
  var q = $('searchInput').value.trim().toLowerCase();
  var el = $('searchResults');
  if (!q) { el.innerHTML = '<div class="empty"><div class="eic">🔍</div><p>输入关键词搜索小说</p></div>'; return; }
  var books = DB.novels.filter(function(n) {
    return n.title.toLowerCase().indexOf(q) !== -1 || n.author.toLowerCase().indexOf(q) !== -1;
  });
  if (books.length === 0) { el.innerHTML = '<div class="empty"><div class="eic">📚</div><p>没有找到匹配的小说</p></div>'; return; }
  el.innerHTML = books.map(function(n) {
    return '<div class="ni" onclick="openReader(\'' + n.id + '\')"><div class="nii"><div class="t">' + esc(n.title) + '</div><div class="s">' + esc(n.author) + '</div></div><span style="color:var(--text3)">→</span></div>';
  }).join('');
}

function renderShelf() {
  var grid = $('shelfGrid');
  grid.innerHTML = '';
  var books = DB.novels.slice();
  if (shelfFilter === 'recent') {
    books = books.filter(function(n) { return (n.readAt || 0) > 0; }).sort(function(a, b) { return (b.readAt || 0) - (a.readAt || 0); });
  }
  $('allCount').textContent = DB.novels.length;
  if (books.length === 0 && shelfFilter === 'recent') {
    grid.innerHTML = '<div style="grid-column:1/-1"><div class="empty"><div class="eic">📖</div><p>还没有阅读记录</p></div></div>';
    return;
  }
  if (books.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1"><div class="empty"><div class="eic">📚</div><p>书库还没有小说，点 + 上传一本吧</p></div></div>';
    return;
  }
  books.forEach(function(n, i) {
    var ci = i % CV.length;
    var c = document.createElement('div');
    c.className = 'bc';
    c.innerHTML = '<div class="bco" style="background:' + CV[ci] + '"><div class="em">📕</div><div class="bt">' + esc(n.title) + '</div><div class="bar"><div class="f" style="width:' + (n.progress || 0) + '%"></div></div></div><div class="bn">' + esc(n.title) + '</div><div class="bp">' + (n.progress || 0) + '%</div><button class="delb" onclick="event.stopPropagation();delBook(\'' + n.id + '\')">✕</button>';
    c.addEventListener('click', function() { if (!c.classList.contains('show-del')) openReader(n.id); });
    grid.appendChild(c);
  });
  // Add button
  var a = document.createElement('div');
  a.className = 'ba';
  a.innerHTML = '<div class="bp">+</div><div>上传</div>';
  a.addEventListener('click', function() { showPage('p-upload'); });
  grid.appendChild(a);
  // Del mode button
  $('shelfDelBtn').style.display = books.length > 0 ? '' : 'none';
}

// ============================================================
// Delete
// ============================================================
function delBook(id) {
  var n = DB.novels.find(function(x) { return x.id === id; });
  if (!n) return;
  if (!confirm('删除《' + n.title + '》？')) return;
  DB.novels = DB.novels.filter(function(x) { return x.id !== id; });
  saveData();
  toast('已删除');
  renderShelf();
}

// ============================================================
// Download novel as .txt
// ============================================================
function downloadNovel(id) {
  var n = DB.novels.find(function(x) { return x.id === id; });
  if (!n) return;
  var text = n.title + '\n作者: ' + n.author + '\n\n' + n.content;
  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = n.title + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('✅ 已下载: ' + n.title + '.txt');
}

// ============================================================
// Reader
// ============================================================
function parseCh(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var rx = /^(第[一二三四五六七八九十百千0-9]+[章节部回集]|第[0-9]+章|\d+\.\s+|Chapter\s+\d+|序章|前言|序幕|尾声|后记|番外|楔子)/i;
  var chs = [], cur = { title: '开头', content: '' }, cnt = 0;
  lines.forEach(function(l) {
    var t = l.trim();
    if (rx.test(t) && cnt > 3) { chs.push(cur); cur = { title: t, content: '' }; }
    else { cur.content += (cur.content ? '\n\n' : '') + t; }
    cnt++;
  });
  if (cur.content) chs.push(cur);
  if (chs.length === 0) chs.push({ title: '全文', content: text });
  return chs;
}

function openReader(id) {
  var n = DB.novels.find(function(x) { return x.id === id; });
  if (!n) return;
  var chs = parseCh(n.content);
  rdNovel = { id: n.id, title: n.title, author: n.author, chapters: chs };
  rdCh = 0;
  showPage('p-reader');
  $('readerTop').classList.remove('hide');
  $('readerBottom').classList.remove('hide');
  $('readerTitle').textContent = n.title;
  $('rdContent').className = 'rcontent' + (window.innerWidth < window.innerHeight ? ' col2' : '');
  renderCh();
  n.readAt = Date.now();
  n.progress = Math.round((rdCh + 1) / chs.length * 100);
  saveData();
}

function renderCh() {
  if (!rdNovel) return;
  var ch = rdNovel.chapters[rdCh];
  $('rdTitle').textContent = ch.title;
  var total = rdNovel.chapters.length;
  $('rdInfo').textContent = (rdCh + 1) + ' / ' + total;
  $('rdProgress').value = total > 1 ? Math.round(rdCh / (total - 1) * 100) : 0;
  $('rdContent').innerHTML = ch.content.split('\n\n').filter(Boolean).map(function(p) { return '<p>' + esc(p.trim()) + '</p>'; }).join('');
  window.scrollTo(0, 0);
  var nn = DB.novels.find(function(x) { return x.id === rdNovel.id; });
  if (nn) { nn.progress = Math.round((rdCh + 1) / total * 100); nn.readAt = Date.now(); saveData(); }
}

// Progress slider
$('rdProgress').addEventListener('input', function() {
  if (!rdNovel || rdNovel.chapters.length <= 1) return;
  var idx = Math.round(parseInt(this.value) / 100 * (rdNovel.chapters.length - 1));
  if (idx !== rdCh) { rdCh = idx; renderCh(); }
});

// Navigation
$('prevCh').addEventListener('click', function() { if (rdCh > 0) { rdCh--; renderCh(); } });
$('nextCh').addEventListener('click', function() { if (rdNovel && rdCh < rdNovel.chapters.length - 1) { rdCh++; renderCh(); } });

// Swipe
var tx = 0;
document.addEventListener('touchstart', function(e) { if (rdNovel) tx = e.changedTouches[0].screenX; });
document.addEventListener('touchend', function(e) {
  if (!rdNovel || tx === 0) return;
  var d = e.changedTouches[0].screenX - tx;
  if (Math.abs(d) > 50) { if (d > 0) $('prevCh').click(); else $('nextCh').click(); }
  tx = 0;
});

// Tap center to toggle controls
$('readerBody').addEventListener('click', function(e) {
  if (e.target.closest('.rtb') || e.target.closest('.rnb') || e.target.closest('#rdProgress') || e.target.closest('.hi')) return;
  $('readerTop').classList.toggle('hide');
  $('readerBottom').classList.toggle('hide');
});

// Back
$('readerBack').addEventListener('click', function() { rdNovel = null; showPage('p-shelf'); });

// ============================================================
// TOC
// ============================================================
function openToc() {
  if (!rdNovel) return;
  var el = $('tocList');
  el.innerHTML = rdNovel.chapters.map(function(c, i) {
    return '<div class="toc-item' + (i === rdCh ? ' active' : '') + '" onclick="jumpCh(' + i + ')"><span class="tc-num">' + (i + 1) + '</span><span>' + esc(c.title || '无标题') + '</span></div>';
  }).join('');
  $('tocOverlay').style.display = 'block';
  $('tocOverlay').classList.add('s');
  $('tocPanel').classList.add('s');
}
$('readerTocBtn').addEventListener('click', openToc);
$('rtToc').addEventListener('click', openToc);
$('tocOverlay').addEventListener('click', function() { $('tocOverlay').style.display = 'none'; $('tocOverlay').classList.remove('s'); $('tocPanel').classList.remove('s'); });
$('tocClose').addEventListener('click', function() { $('tocOverlay').style.display = 'none'; $('tocOverlay').classList.remove('s'); $('tocPanel').classList.remove('s'); });
function jumpCh(i) { rdCh = i; renderCh(); $('tocOverlay').style.display = 'none'; $('tocOverlay').classList.remove('s'); $('tocPanel').classList.remove('s'); }

// ============================================================
// Settings
// ============================================================
$('rtFont').addEventListener('click', function() { $('settingsOverlay').style.display = 'block'; $('settingsOverlay').classList.add('s'); $('settingsPanel').classList.add('s'); });
$('rtTheme').addEventListener('click', function() { $('settingsOverlay').style.display = 'block'; $('settingsOverlay').classList.add('s'); $('settingsPanel').classList.add('s'); });
$('settingsOverlay').addEventListener('click', function() { $('settingsOverlay').style.display = 'none'; $('settingsOverlay').classList.remove('s'); $('settingsPanel').classList.remove('s'); });

// Theme
document.querySelectorAll('.theme-d').forEach(function(dot) {
  dot.addEventListener('click', function() {
    document.querySelectorAll('.theme-d').forEach(function(x) { x.classList.remove('active'); });
    dot.classList.add('active');
    var t = dot.dataset.t;
    document.body.className = 'theme-' + t;
    try { localStorage.setItem('ys_theme', t); } catch(e) {}
  });
});
(function() {
  try {
    var st = localStorage.getItem('ys_theme');
    if (st) {
      document.body.className = 'theme-' + st;
      document.querySelectorAll('.theme-d').forEach(function(x) { x.classList.toggle('active', x.dataset.t === st); });
    }
  } catch(e) {}
})();

// Font
$('fontSlider').addEventListener('input', function() {
  var v = this.value;
  document.documentElement.style.setProperty('--fs', v + 'px');
  $('fontLabel').textContent = v;
  try { localStorage.setItem('ys_fs', v); } catch(e) {}
});
(function() { try { var sf = localStorage.getItem('ys_fs'); if (sf) { $('fontSlider').value = sf; $('fontSlider').dispatchEvent(new Event('input')); } } catch(e) {} })();

// Line spacing
$('lineSpace').addEventListener('change', function() {
  document.documentElement.style.setProperty('--lh', this.value);
  try { localStorage.setItem('ys_lh', this.value); } catch(e) {}
});
(function() { try { var sl = localStorage.getItem('ys_lh'); if (sl) { $('lineSpace').value = sl; document.documentElement.style.setProperty('--lh', sl); } } catch(e) {} })();

// Download from reader
$('rtDl').addEventListener('click', function() {
  if (rdNovel) downloadNovel(rdNovel.id);
});

// ============================================================
// Upload
// ============================================================
$('uploadArea').addEventListener('click', function() { $('fileInput').click(); });
$('fileInput').addEventListener('change', function(e) {
  var f = e.target.files[0];
  $('fileName').textContent = f ? f.name : '未选择文件';
  if (f && !$('novTitle').value) $('novTitle').value = f.name.replace(/\.txt$/i, '');
});
$('uploadBtn').addEventListener('click', async function() {
  var file = $('fileInput').files[0];
  if (!file) { toast('请先选择 .txt 文件'); return; }
  var btn = this;
  btn.disabled = true;
  btn.innerHTML = '⏳ 处理中…';
  try {
    var text = await new Promise(function(resolve) {
      var r = new FileReader();
      r.onload = function(ev) {
        var t = ev.target.result, bad = 0;
        for (var i = 0; i < Math.min(500, t.length); i++) { var c = t.charCodeAt(i); if ((c >= 0x80 && c <= 0x9F) || (c >= 0xA1 && c <= 0xBF)) bad++; }
        if (t.length > 20 && bad / t.length > 0.02) {
          var r2 = new FileReader();
          r2.onload = function(e) { try { var a = new Uint8Array(e.target.result); t = new TextDecoder('gbk').decode(a); } catch(e2) {} resolve(t); };
          r2.readAsArrayBuffer(file);
        } else resolve(t);
      };
      r.onerror = function() { toast('读取失败'); resolve(null); };
      r.readAsText(file, 'utf-8');
    });
    if (!text || text.trim().length < 10) { toast('文件内容为空'); btn.disabled = false; btn.innerHTML = '上传'; return; }
    var title = $('novTitle').value.trim() || file.name.replace(/\.txt$/i, '');
    var author = $('novAuthor').value.trim() || '未知';
    DB.novels.push({ id: uid(), title: title, author: author, content: text, status: 'approved', uploadedAt: Date.now(), progress: 0, readAt: 0 });
    saveData();
    toast('✅ 上传成功！');
    $('fileInput').value = '';
    $('fileName').textContent = '未选择文件';
    $('novTitle').value = '';
    $('novAuthor').value = '';
    renderUploads();
  } catch(e) { toast('❌ ' + e.message); }
  btn.disabled = false;
  btn.innerHTML = '上传';
});

function renderUploads() {
  var el = $('myUploads');
  if (DB.novels.length === 0) { el.innerHTML = '<div class="empty"><p style="font-size:13px;">书库为空，快上传一本吧</p></div>'; return; }
  el.innerHTML = DB.novels.slice().reverse().map(function(n) {
    return '<div class="ni"><div class="nii"><div class="t">' + esc(n.title) + ' <small style="color:var(--text3)">' + esc(n.author) + '</small></div><div class="s">' + badge(n.status) + ' · ' + ago(n.uploadedAt) + '</div></div><button class="btn btn-sm btn-ghost" onclick="downloadNovel(\'' + n.id + '\')" style="flex-shrink:0;background:0;border:1px solid var(--border);color:var(--text2);cursor:pointer">⬇</button></div>';
  }).join('');
}

// ============================================================
// Admin
// ============================================================
function renderAdmin() {
  $('stUsers').textContent = 1;
  $('stTotal').textContent = DB.novels.length;
  $('stPending').textContent = 0;
  // All novels
  var allN = $('allNovelsList');
  if (DB.novels.length === 0) { allN.innerHTML = '<div class="empty"><p>暂无小说</p></div>'; return; }
  var sorted = DB.novels.slice().sort(function(a, b) { return b.uploadedAt - a.uploadedAt; });
  allN.innerHTML = sorted.map(function(n) {
    return '<div class="ni"><div class="nii"><div class="t">' + esc(n.title) + ' <small style="color:var(--text3)">' + esc(n.author) + '</small></div><div class="s">' + badge(n.status) + ' · ' + ago(n.uploadedAt) + '</div></div><button class="btn btn-sm btn-ghost" onclick="delBook(\'' + n.id + '\')" style="color:var(--danger);background:0;border:1px solid var(--border);cursor:pointer">下架</button></div>';
  }).join('');
}

// ============================================================
// Tab clicks
// ============================================================
document.querySelectorAll('.tab-btn[data-p]').forEach(function(btn) {
  btn.addEventListener('click', function() { showPage(btn.dataset.p); });
});

// ============================================================
// Orientation
// ============================================================
window.addEventListener('resize', function() {
  if (rdNovel) {
    $('rdContent').className = 'rcontent' + (window.innerWidth < window.innerHeight ? ' col2' : '');
  }
});

// ============================================================
// Boot
// ============================================================
showPage('p-shelf');

// Global exports
window.openReader = openReader;
window.delBook = delBook;
window.downloadNovel = downloadNovel;
window.jumpCh = jumpCh;
</script>
</body>
